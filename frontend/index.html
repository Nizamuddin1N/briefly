<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Briefly — Ask a research question and get a sourced briefing in under a minute." />
    <title>Briefly</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('ra_theme') || 'system'
          var resolved =
            stored === 'system'
              ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : stored
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
